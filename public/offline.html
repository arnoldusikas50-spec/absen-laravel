<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e11d48">
<title>Offline — Presensi</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #fff1f2; color: #431407; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 24px; padding: 36px 28px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 12px 40px rgba(225,29,72,.15); }
  .icon { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px; display: block; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { font-size: 14px; color: #78716c; margin-bottom: 20px; line-height: 1.6; }
  .btn { display: inline-block; background: #e11d48; color: #fff; font-weight: 700; font-size: 14px; padding: 12px 28px; border-radius: 999px; text-decoration: none; border: none; cursor: pointer; }
  .btn:active { transform: scale(.97); }
  small { display: block; margin-top: 14px; color: #a8a29e; font-size: 11px; }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/icons/icon-192.png" alt="Presensi">
    <h1>Anda sedang offline</h1>
    <p>Presensi membutuhkan koneksi internet untuk GPS &amp; verifikasi. Data check-in yang tertunda akan tersinkron otomatis saat online kembali.</p>
    <button class="btn" onclick="location.reload()">Coba Lagi</button>
    <small>Presensi Guru &bull; Mode Offline</small>
  </div>
</body>
</html>
